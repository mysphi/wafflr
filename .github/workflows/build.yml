name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache sherpa-onnx library and bundled voice
        uses: actions/cache@v4
        with:
          path: |
            app/libs
            app/src/main/assets/voices
          key: deps-${{ hashFiles('scripts/fetch-deps.sh') }}

      - name: Fetch sherpa-onnx and bundled voice
        run: ./scripts/fetch-deps.sh

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        id: apk
        run: |
          short=$(git rev-parse --short HEAD)
          out="wafflr-${GITHUB_RUN_NUMBER}-${short}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$out"
          ls -lh "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: wafflr-apk
          path: ${{ steps.apk.outputs.file }}

      # A rolling pre-release you can open on your phone to download the newest test build.
      - name: Publish test build to Releases
        run: |
          branch="${GITHUB_REF_NAME}"
          tag="test-build"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" "${{ steps.apk.outputs.file }}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Latest test build (${branch}, build ${GITHUB_RUN_NUMBER})" \
            --notes "Built from branch ${branch} at ${GITHUB_SHA}. Download the .apk on your phone and open it to install."

      - name: Prepare download page
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          cp "${{ steps.apk.outputs.file }}" site/wafflr.apk
          cat > site/index.html <<HTML
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Wafflr download</title>
          <style>body{font-family:system-ui,sans-serif;max-width:36rem;margin:2rem auto;padding:0 16px;line-height:1.5}
          a.b{display:inline-block;padding:12px 20px;border-radius:8px;background:#2d6cdf;color:#fff;text-decoration:none}</style>
          </head><body><h1>Wafflr</h1>
          <p>Test build ${GITHUB_RUN_NUMBER} from main.</p>
          <p><a class="b" href="wafflr.apk">Download the APK</a></p>
          <p>Open the file on your Android phone to install. You may need to allow installs from your browser.</p>
          </body></html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
